name: Morning Deal Scan

on:
  schedule:
    - cron: '0 13 * * *'   # 8:00 AM EST (UTC-5). Change to '0 12 * * *' in summer (EDT)
  workflow_dispatch:
    inputs:
      markets:
        description: 'Override markets (comma-separated). Blank = use SCAN_MARKETS variable.'
        required: false
        default: ''

jobs:
  scan:
    name: Scan & Score Deals
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run morning deal scan
        run: npx tsx scripts/morning-deal-scan.ts
        env:
          # ── Required secrets ──────────────────────────────────────────────
          # Set these in: GitHub repo → Settings → Secrets → Actions
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

          # ── Data source: provide ONE of these two ─────────────────────────
          #
          # Option A — Zillow via RapidAPI (free tier: 100 req/month)
          #   Already in your Vercel env if the CRM's Deal Scanner works.
          #   Just copy it to GitHub Secrets with the name RAPIDAPI_KEY.
          #   RapidAPI signup (free): https://rapidapi.com
          #
          # Option B — Rentcast (free tier: 50 req/month, ~$9/mo for 500)
          #   Sign up free at https://rentcast.io — email only, no credit card.
          #   Add your key to GitHub Secrets as RENTCAST_API_KEY.
          #
          RAPIDAPI_KEY:         ${{ secrets.RAPIDAPI_KEY }}
          RENTCAST_API_KEY:     ${{ secrets.RENTCAST_API_KEY }}

          # ── Required variable ─────────────────────────────────────────────
          # Set in: GitHub repo → Settings → Variables → Actions
          # Example value: "Gatlinburg TN, Blue Ridge GA, Asheville NC"
          SCAN_MARKETS: ${{ inputs.markets || vars.SCAN_MARKETS }}

          # ── Optional variables (all have defaults) ────────────────────────
          SCAN_MIN_BEDS:   ${{ vars.SCAN_MIN_BEDS }}    # default: 2
          SCAN_MAX_PRICE:  ${{ vars.SCAN_MAX_PRICE }}   # default: 600000
          SCAN_MIN_SCORE:  ${{ vars.SCAN_MIN_SCORE }}   # default: 6
          SCAN_MODEL:      ${{ vars.SCAN_MODEL }}       # default: claude-haiku-4-5-20251001

          # ── Optional email notification ───────────────────────────────────
          NOTIFY_EMAIL:    ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
